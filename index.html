<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season 1 Official Launch Countdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      gap: 32px;
      padding: 20px;
    }

    /* Outer Card Wrapper */
    .countdown-card {
      background-color: #12131a;
      border: 1px solid #1e202d;
      border-radius: 16px;
      padding: 36px 40px 40px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Heading Text */
    .countdown-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #a0a5b5;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Grid/Flex Container for Units */
    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    /* Unit Container */
    .timer-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 110px;
    }

    /* Digital Display Box */
    .time-box {
      background-color: #1a1c26;
      border: 1px solid #282b3a;
      border-radius: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* Unit Label */
    .unit-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #8c92a4;
      text-transform: uppercase;
    }

    /* Coming Soon Date Subtext */
    .launch-date-text {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ff3b30;
      text-transform: uppercase;
    }

    /* Action Buttons Area */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }

    .btn {
      padding: 16px 28px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-primary {
      background-color: #ff3b30;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(255, 59, 48, 0.4);
    }

    .btn-primary:hover {
      background-color: #e03228;
      box-shadow: 0 6px 20px rgba(255, 59, 48, 0.6);
    }

    .btn-secondary {
      background-color: #12131a;
      color: #ffffff;
      border: 1px solid #282b3a;
    }

    .btn-secondary:hover {
      background-color: #1a1c26;
      border-color: #3a3f54;
    }

    .btn-primary .arrow {
      margin-left: 8px;
      font-size: 16px;
    }

    @media (max-width: 480px) {
      .countdown-timer {
        gap: 8px;
      }
      .time-box {
        font-size: 32px;
      }
      .button-group {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Countdown Card -->
  <div class="countdown-card">
    <div class="countdown-title">Season 1 Official Launch Countdown</div>
    <div class="countdown-timer">
      <div class="timer-unit">
        <div class="time-box" id="days">02</div>
        <div class="unit-label">Days</div>
      </div>
      <div class="timer-unit">
        <div class="time-box" id="hours">16</div>
        <div class="unit-label">Hours</div>
      </div>
      <div class="timer-unit">
        <div class="time-box" id="minutes">50</div>
        <div class="unit-label">Mins</div>
      </div>
      <div class="timer-unit">
        <div class="time-box" id="seconds">50</div>
        <div class="unit-label">Secs</div>
      </div>
    </div>
    <div class="launch-date-text">Coming Aug 10</div>
  </div>

  <!-- Action Buttons -->
  <div class="button-group">
    <button class="btn btn-primary">
      Submit Application <span class="arrow">&rarr;</span>
    </button>
    <button class="btn btn-secondary">
      Explore Features
    </button>
  </div>

</body>
</html>
